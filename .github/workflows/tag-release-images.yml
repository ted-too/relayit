name: Tag Release Images

# Kept for manual backfill / external release events. New releases from
# Semantic Release build images in that workflow (GITHUB_TOKEN cannot chain
# `on: release` workflows).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.4-alpha.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: normalize-repo
        run: |
          set -euo pipefail
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${REPO_OWNER_LOWER}/relayit-${{ matrix.app }}"
          echo "repo-name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag format
        id: validate-tag
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "Validating release tag: $VERSION"

          if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            CLEAN_VERSION=${VERSION#v}
            echo "clean-version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

            if echo "$CLEAN_VERSION" | grep -q '-'; then
              echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Invalid tag format: $VERSION"
            echo "Expected: v?X.Y.Z(-prerelease)?"
            exit 1
          fi

      - name: Compute image tags
        id: image-tags
        run: |
          set -euo pipefail
          REGISTRY="${{ env.REGISTRY }}"
          REPO_NAME="${{ steps.normalize-repo.outputs.repo-name }}"
          CLEAN_VERSION="${{ steps.validate-tag.outputs.clean-version }}"
          IS_PRERELEASE="${{ steps.validate-tag.outputs.is-prerelease }}"

          TAGS="${REGISTRY}/${REPO_NAME}:${CLEAN_VERSION}"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            TAGS="${TAGS},${REGISTRY}/${REPO_NAME}:alpha"
          else
            TAGS="${TAGS},${REGISTRY}/${REPO_NAME}:main"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
            turbo_team=${{ secrets.TURBO_TEAM }}

      - name: Release tagging complete
        run: |
          set -euo pipefail
          CLEAN_VERSION="${{ steps.validate-tag.outputs.clean-version }}"
          REPO_NAME="${{ steps.normalize-repo.outputs.repo-name }}"
          IS_PRERELEASE="${{ steps.validate-tag.outputs.is-prerelease }}"

          echo "${{ matrix.app }} published as ${REPO_NAME}:${CLEAN_VERSION}"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Also tagged ${REPO_NAME}:alpha (floating newest alpha)"
          else
            echo "Also tagged ${REPO_NAME}:main"
          fi
