services:
  # Applies the release's database migrations, then exits. The api and the worker start
  # only once it has succeeded; `docker compose up` runs it again each time, and it changes
  # nothing when the database is current.
  migrate:
    image: ghcr.io/ted-too/relayit-api:${IMAGE_TAG:-alpha}
    command: ["bun", "run", "migrate.js"]
    # One run per `up`: a step that failed says why and stays failed, rather than running the
    # same migration again.
    restart: "no"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-relayit}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - relayit-network

  # The public API, sign-in, and every operation the dashboard calls.
  api:
    image: ghcr.io/ted-too/relayit-api:${IMAGE_TAG:-alpha}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3005}:3005"
    environment:
      - PORT=3005
      - LOG_LEVEL=${LOG_LEVEL:-Info}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-relayit}?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - API_URL=${API_URL:-http://localhost:3005}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
      - BETTER_AUTH_SECRETS=${BETTER_AUTH_SECRETS:?set BETTER_AUTH_SECRETS in .env}
      - SES_REGIONS=${SES_REGIONS:?set SES_REGIONS in .env}
      - SES_ACCESS_KEY_ID=${SES_ACCESS_KEY_ID:?set SES_ACCESS_KEY_ID in .env}
      - SES_SECRET_ACCESS_KEY=${SES_SECRET_ACCESS_KEY:?set SES_SECRET_ACCESS_KEY in .env}
      - S3_ENDPOINT=${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      - S3_BUCKET=${S3_BUCKET:-relayit}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3005/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - relayit-network

  # Background work: delivery, retries, Domain verification, outbound webhooks. Without it
  # sends are accepted and queue, but nothing goes out.
  worker:
    image: ghcr.io/ted-too/relayit-worker:${IMAGE_TAG:-alpha}
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-Info}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-relayit}?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - API_URL=${API_URL:-http://localhost:3005}
      - BETTER_AUTH_SECRETS=${BETTER_AUTH_SECRETS:?set BETTER_AUTH_SECRETS in .env}
      - SES_REGIONS=${SES_REGIONS:?set SES_REGIONS in .env}
      - SES_ACCESS_KEY_ID=${SES_ACCESS_KEY_ID:?set SES_ACCESS_KEY_ID in .env}
      - SES_SECRET_ACCESS_KEY=${SES_SECRET_ACCESS_KEY:?set SES_SECRET_ACCESS_KEY in .env}
      - S3_ENDPOINT=${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      - S3_BUCKET=${S3_BUCKET:-relayit}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - relayit-network

  # The dashboard: static files, and /config.js telling the browser where the api is. The
  # browser calls the api itself, so API_URL is the api's public URL, not a Compose name.
  web:
    image: ghcr.io/ted-too/relayit-web:${IMAGE_TAG:-alpha}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - API_URL=${API_URL:-http://localhost:3005}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/config.js"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - relayit-network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-relayit}
    volumes:
      # The parent of the data directory, as the 18 images require: they keep the cluster in
      # a directory named for its major version beneath it, and refuse to start with a
      # volume at the older /var/lib/postgresql/data.
      - relayit_postgres_data:/var/lib/postgresql
    healthcheck:
      # Over TCP, as the services connect. Over the socket it would also pass for the server
      # the image runs to set up a new volume, which takes no TCP connections and stops again.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relayit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relayit-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - relayit-network

networks:
  relayit-network:
    driver: bridge

volumes:
  relayit_postgres_data:
  redis_data:
